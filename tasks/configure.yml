---
- name: Check need to create admin
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -execute "show users"
  ignore_errors: true
  register: should_create_admin
  when: not ansible_check_mode

- name: Create initial admin users
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -execute "CREATE USER \"{{ item.username }}\" WITH PASSWORD '{{ item.password }}' WITH ALL PRIVILEGES"
  loop: "{{ influxdb_users.admin }}"
  when: 'not ansible_check_mode and "unable to parse authentication credentials" not in should_create_admin.stdout'

- name: Create regular users
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -username "{{ influxdb_users.admin[0].username }}" -password "{{ influxdb_users.admin[0].password }}"
      -execute "CREATE USER \"{{ item.username }}\" WITH PASSWORD '{{ item.password }}'"
  loop: "{{ influxdb_users.regular }}"
  when: not ansible_check_mode

- name: Create databases
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -username "{{ influxdb_users.admin[0].username }}" -password "{{ influxdb_users.admin[0].password }}"
      -execute "CREATE DATABASE \"{{ db_item.name if db_item is mapping else db_item }}\""
  loop: "{{ influxdb_databases }}"
  loop_control:
    loop_var: db_item
  when: not ansible_check_mode

- name: Create custom retention policies for databases
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -username "{{ influxdb_users.admin[0].username }}" -password "{{ influxdb_users.admin[0].password }}"
      -execute "CREATE RETENTION POLICY {{ policy.name }} ON {{ db_item.name }} DURATION {{ policy.duration }} REPLICATION {{ policy.replication }} {% if policy.default | default(false) %}DEFAULT{% endif %}"
  loop: "{{ influxdb_databases | selectattr('retention_policies', 'defined') | list }}"
  loop_control:
    loop_var: db_item
  with_subelements:
    - "{{ influxdb_databases | selectattr('retention_policies', 'defined') | list }}"
    - retention_policies
  vars:
    policy: "{{ item.1 }}"
    db_item: "{{ item.0 }}"
  when: not ansible_check_mode

- name: Create default retention policy for databases without custom policies
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -username "{{ influxdb_users.admin[0].username }}" -password "{{ influxdb_users.admin[0].password }}"
      -execute "CREATE RETENTION POLICY {{ influxdb_default_retention_policy.name }} ON {{ db_item.name if db_item is mapping else db_item }} DURATION {{ influxdb_default_retention_policy.duration }} REPLICATION {{ influxdb_default_retention_policy.replication }} {% if influxdb_default_retention_policy.default | default(false) %}DEFAULT{% endif %}"
  loop: "{{ influxdb_databases | rejectattr('retention_policies', 'defined') | list }}"
  loop_control:
    loop_var: db_item
  when: 
    - not ansible_check_mode
    - influxdb_default_retention_policy is defined

- name: Grant permissions to users
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -username "{{ influxdb_users.admin[0].username }}" -password "{{ influxdb_users.admin[0].password }}"
      -execute "GRANT {{ perm.privileges }} ON {{ perm.database }} TO {{ user_name }}"
  vars:
    user_name: "{{ item.0 }}"
    perm: "{{ item.1 }}"
  with_subelements:
    - "{{ influxdb_user_permissions | dict2items }}"
    - value.databases
  when: 
    - not ansible_check_mode
    - influxdb_user_permissions is defined

- name: Create internal databases if requested
  community.docker.docker_container_exec:
    container: "{{ influxdb_container.name }}"
    command: |
      influx -username "{{ influxdb_users.admin[0].username }}" -password "{{ influxdb_users.admin[0].password }}"
      -execute "CREATE DATABASE \"_internal\""
  when: 
    - not ansible_check_mode
    - influxdb_create_internal_databases | default(false)
